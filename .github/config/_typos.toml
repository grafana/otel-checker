[default]
# Go pseudo-version hashes can contain words that typos flags; these immutable
# dependency revisions are not prose. Keep the exception scoped to Go module
# pseudo-versions so ordinary words and hashes remain checked.
extend-ignore-re = ['\.atMost\(', '\bv\d+\.\d+\.\d+-[0-9A-Za-z.]*\d{14}-[0-9a-f]{12}\b']
