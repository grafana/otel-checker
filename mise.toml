[tools]
go = "1.24.3"
golangci-lint = "2.1.6"
uv = "0.7.3"

[tasks.build]
description = "Build the application"
run = "go install"

[tasks.test]
description = "Run tests"
run = "go test $(go list ./...)"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f otel-checker
go clean
"""

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.lint]
description = "Lint code"
run = "golangci-lint run"

[tasks.deps]
description = "Update dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ['lint', 'test']

[tasks.generate-dotnet-supported-libraries]
run = "uv run scripts/generate_dotnet_supported_libraries.py ../opentelemetry-dotnet-contrib -o ./checks/sdk/dotnet/supported-libraries.yaml"

[tasks.generate-go-supported-libraries]
run = "uv run scripts/generate_go_supported_libraries.py ../opentelemetry-go-contrib -o ./checks/sdk/go/supported-libraries.yaml"

[tasks.generate-java-supported-libraries]
run = "uv run scripts/generate_java_supported_libraries.py ../opentelemetry-java-instrumentation -o checks/sdk/java/supported-libraries.yaml"

[tasks.generate-js-supported-libraries]
run = "uv run scripts/generate_js_supported_libraries.py ../opentelemetry-js-contrib -o checks/sdk/js/supported-libraries.yaml"

[tasks.generate-python-supported-libraries]
run = "uv run scripts/generate_python_supported_libraries.py ../opentelemetry-python-contrib -o checks/sdk/python/supported-libraries.yaml"

[tasks.generate]
depends = ["generate-dotnet-supported-libraries","generate-go-supported-libraries", "generate-java-supported-libraries", "generate-js-supported-libraries", "generate-python-supported-libraries"]

[tasks.csv]
run = "uv run scripts/generate_csv.py"
