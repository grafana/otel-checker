[tools]
go = "1.26.2"
node = "24.15.0"
uv = "0.11.7"

# Linters
actionlint = "1.7.10"
"aqua:owenlamont/ryl" = "0.6.0"
biome = "2.4.13"
editorconfig-checker = "v3.6.1"
"github:grafana/flint" = "0.21.0"
"github:koalaman/shellcheck" = "v0.11.0"
golangci-lint = "2.11.4"
lychee = "0.22.0"
"npm:renovate" = "43.141.4"
"pipx:codespell" = "2.4.2"
ruff = "0.15.12"
rumdl = "0.1.82"
shfmt = "v3.12.0"
taplo = "0.10.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.build]
description = "Build the application"
run = "go install"

[tasks.test]
description = "Run tests"
run = "go test $(go list ./...)"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f otel-checker
go clean
"""

[tasks.deps]
description = "Update dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]

[tasks.generate-go-supported-libraries]
run = """
uv run scripts/generate_go_supported_libraries.py \
  ../opentelemetry-go-contrib \
  -o checks/sdk/go/supported-libraries.yaml
"""

[tasks.generate-js-supported-libraries]
run = """
uv run scripts/generate_js_supported_libraries.py \
  ../opentelemetry-js-contrib \
  -o checks/sdk/js/supported-libraries.yaml
"""

[tasks.generate]
depends = ["generate-go-supported-libraries", "generate-js-supported-libraries"]
