[tools]
go = "1.27.1"
goreleaser = "2.18.0"
node = "24.20.0"
uv = "0.12.9"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.11"
"aqua:owenlamont/ryl" = "0.21.0"
biome = "2.5.11"
editorconfig-checker = "3.11.2"
golangci-lint = "2.13.2"
lychee = "0.24.2"
# @yarnpkg/libzip 3.2.2 is npm-signed and matches Yarn's release commit, but
# was published without provenance; mise's no-downgrade policy otherwise rejects Renovate.
"npm:renovate" = { version = "44.48.3", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
ruff = "0.16.5"
rumdl = "v0.2.62"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
typos = "1.49.1"
zizmor = "1.29.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.build]
description = "Build the application"
run = "go install ./cmd/otel-checker"

[tasks.test]
description = "Run tests"
run = "go test $(go list ./...)"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f otel-checker
go clean
"""

[tasks.deps]
description = "Update dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]

[tasks.generate-go-supported-libraries]
usage = 'flag "--clone-folders <path>" help="Parent directory containing the opentelemetry-{go,js}-contrib clones" default=".."'
run = """
uv run scripts/generate_go_supported_libraries.py \
  ${usage_clone_folders}/opentelemetry-go-contrib \
  -o checks/sdk/go/supported-libraries.yaml
"""

[tasks.generate-js-supported-libraries]
usage = 'flag "--clone-folders <path>" help="Parent directory containing the opentelemetry-{go,js}-contrib clones" default=".."'
run = """
uv run scripts/generate_js_supported_libraries.py \
  ${usage_clone_folders}/opentelemetry-js-contrib \
  -o checks/sdk/js/supported-libraries.yaml
"""

[tasks.generate]
usage = 'flag "--clone-folders <path>" help="Parent directory containing the opentelemetry-{go,js}-contrib clones" default=".."'
depends = [
  "generate-go-supported-libraries --clone-folders {{usage.clone_folders}}",
  "generate-js-supported-libraries --clone-folders {{usage.clone_folders}}",
]
