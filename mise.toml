[tools]
go = "1.26.2"
golangci-lint = "2.11.4"
uv = "0.11.6"
lychee = "0.22.0"
"npm:renovate" = "43.110.13"
node = "24.14.1"

[env]
RENOVATE_TRACKED_DEPS_EXCLUDE="github-actions,github-runners"
# renovate: datasource=docker depName=ghcr.io/super-linter/super-linter
SUPER_LINTER_VERSION="v8.4.0@sha256:c5e3307932203ff9e1e8acfe7e92e894add6266605b5d7fb525fb371a59a26f4"

# Shared lint tasks from flint (https://github.com/grafana/flint)
[tasks."lint:super-linter"]
description = "Run Super-Linter on the repository"
file = "https://raw.githubusercontent.com/grafana/flint/eded4cd370c729289a6de327a1a26831e10a39b9/tasks/lint/super-linter.sh" # v0.20.2
[tasks."lint:links"]
description = "Check for broken links in changed files + all local links"
file = "https://raw.githubusercontent.com/grafana/flint/eded4cd370c729289a6de327a1a26831e10a39b9/tasks/lint/links.sh" # v0.20.2
[tasks."lint:renovate-deps"]
description = "Verify renovate-tracked-deps.json is up to date"
file = "https://raw.githubusercontent.com/grafana/flint/eded4cd370c729289a6de327a1a26831e10a39b9/tasks/lint/renovate-deps.py" # v0.20.2

[tasks."setup:native-lint-tools"]
file = "https://raw.githubusercontent.com/grafana/flint/eded4cd370c729289a6de327a1a26831e10a39b9/tasks/setup/native-lint-tools.sh" # v0.20.2

[tasks.build]
description = "Build the application"
run = "go install"

[tasks.test]
description = "Run tests"
run = "go test $(go list ./...)"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f otel-checker
go clean
"""

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."lint:fast"]
description = "Run all lints except renovate-deps"
depends = ["lint:super-linter", "lint:links", "lint:go"]

[tasks."lint"]
description = "Run all lints"
depends = ["lint:fast", "lint:renovate-deps"]

[tasks."native-lint"]
description = "Run lints using native tools (no Docker)"
run = "NATIVE=true mise run lint:fast"

[tasks."pre-commit"]
description = "Pre-commit hook"
depends = ["setup:native-lint-tools"]
run = "NATIVE=true mise run lint:fast"

[tasks."setup:pre-commit-hook"]
description = "Install git pre-commit hook"
run = "mise generate git-pre-commit --write --task=pre-commit"

[tasks.fix]
description = "Auto-fix lint issues and regenerate tracked deps"
run = "AUTOFIX=true mise run lint"

[tasks.deps]
description = "Update dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ['lint:go', 'test']

[tasks.generate-go-supported-libraries]
run = "uv run scripts/generate_go_supported_libraries.py ../opentelemetry-go-contrib -o checks/sdk/go/supported-libraries.yaml"

[tasks.generate-js-supported-libraries]
run = "uv run scripts/generate_js_supported_libraries.py ../opentelemetry-js-contrib -o checks/sdk/js/supported-libraries.yaml"

[tasks.generate]
depends = ["generate-go-supported-libraries", "generate-js-supported-libraries"]
