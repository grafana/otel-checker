[tools]
go = "1.26.3"
node = "24.15.0"
uv = "0.11.14"

# Linters
actionlint = "1.7.10"
"aqua:grafana/flint" = "0.22.2"
"aqua:owenlamont/ryl" = "0.9.1"
biome = "2.4.13"
editorconfig-checker = "3.6.1"
golangci-lint = "2.12.2"
lychee = "0.24.2"
"npm:renovate" = "43.150.0"
ruff = "0.15.12"
rumdl = "0.1.82"
shellcheck = "0.11.0"
shfmt = "3.12.0"
taplo = "0.10.0"
typos = "1.46.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.build]
description = "Build the application"
run = "go install"

[tasks.test]
description = "Run tests"
run = "go test $(go list ./...)"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f otel-checker
go clean
"""

[tasks.deps]
description = "Update dependencies"
run = "go mod tidy"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]

[tasks.generate-go-supported-libraries]
run = """
uv run scripts/generate_go_supported_libraries.py \
  ../opentelemetry-go-contrib \
  -o checks/sdk/go/supported-libraries.yaml
"""

[tasks.generate-js-supported-libraries]
run = """
uv run scripts/generate_js_supported_libraries.py \
  ../opentelemetry-js-contrib \
  -o checks/sdk/js/supported-libraries.yaml
"""

[tasks.generate]
depends = ["generate-go-supported-libraries", "generate-js-supported-libraries"]
